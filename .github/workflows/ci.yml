name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types, unit tests, database tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests (pay rules, exports, offline queue, edge-function logic, tooling)
        run: npm test

      # Runs the real migrations and row-level-security policies in an in-process
      # Postgres, as each role. No Supabase project or secrets needed.
      - name: Database tests (migrations, RLS, integrity, payroll parity)
        run: npm run test:sql

      - name: Production build
        run: npm run build

      - name: Demo code must not ship in a production build
        run: |
          if grep -rIl "sitetrack-demo-user" dist/public; then
            echo "::error::Demo backend found in the production bundle"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end (Playwright, demo mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
